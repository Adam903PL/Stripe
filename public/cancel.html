<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anulowano płatność</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      position: relative;
      animation: slideUp 0.6s ease-out;
      text-align: center;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #f56565 0%, #c53030 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s ease-out 0.2s both;
    }
    
    @keyframes scaleIn {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }
    
    .icon-wrapper svg {
      width: 45px;
      height: 45px;
      stroke: white;
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      color: #1a202c;
      font-weight: 700;
    }
    
    p {
      font-size: 1.05rem;
      margin: 12px 0;
      color: #4a5568;
      line-height: 1.6;
    }
    
    .info-box {
      background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
      padding: 24px;
      border-radius: 16px;
      margin: 24px 0;
      border-left: 4px solid #f56565;
    }
    
    .btn {
      display: inline-block;
      margin-top: 28px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 14px 36px;
      border-radius: 12px;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    @media (max-width: 600px) {
      .card {
        padding: 40px 24px;
      }
      
      h1 {
        font-size: 1.6rem;
      }
      
      .icon-wrapper {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
    
    <h1>Płatność anulowana</h1>
    
    <div class="info-box">
      <p>Twoja płatność została anulowana.</p>
      <p>Nie pobrano żadnych opłat z Twojego konta.</p>
    </div>
    
    <p>Jeśli zmieniłeś zdanie, możesz wrócić i spróbować ponownie.</p>
    
    <a href="/" class="btn">Powrót na stronę główną</a>
  </div>
</body>
</html>
