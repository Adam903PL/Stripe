<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dziękujemy za zamówienie!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      position: relative;
      animation: slideUp 0.6s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s ease-out 0.2s both;
    }
    
    @keyframes scaleIn {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }
    
    .icon-wrapper svg {
      width: 45px;
      height: 45px;
      stroke: white;
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      color: #1a202c;
      font-weight: 700;
    }
    
    p {
      font-size: 1.05rem;
      margin: 12px 0;
      color: #4a5568;
      line-height: 1.6;
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 30px 0;
      color: #667eea;
    }
    
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #details {
      margin-top: 30px;
    }
    
    .user-info {
      background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
      padding: 24px;
      border-radius: 16px;
      margin: 24px 0;
      border-left: 4px solid #667eea;
    }
    
    .user-info h2 {
      color: #2d3748;
      font-size: 1.5rem;
      margin-bottom: 12px;
    }
    
    .user-info p {
      color: #4a5568;
      margin: 8px 0;
    }
    
    .user-info b {
      color: #667eea;
      font-weight: 600;
    }
    
    .btn {
      display: inline-block;
      margin-top: 28px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 14px 36px;
      border-radius: 12px;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .error {
      color: #e53e3e;
      background: #fff5f5;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #e53e3e;
    }
    
    @media (max-width: 600px) {
      .card {
        padding: 40px 24px;
      }
      
      h1 {
        font-size: 1.6rem;
      }
      
      .icon-wrapper {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    
    <h1>Płatność zakończona sukcesem!</h1>
    
    <div class="loading">
      <div class="spinner"></div>
      <span>Pobieranie danych zamówienia...</span>
    </div>
    
    <div id="details"></div>
  </div>
  
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");
    
    if (!sessionId) {
      document.querySelector(".loading").style.display = "none";
      document.getElementById("details").innerHTML = '<p class="error">❌ Brak ID sesji płatności.</p>';
    } else {
      fetch(`/order/success?session_id=${sessionId}`)
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            document.querySelector(".loading").style.display = "none";
            document.getElementById("details").innerHTML = `<p class="error">❌ Błąd: ${data.error}</p>`;
            return;
          }
          
          document.querySelector(".loading").style.display = "none";
          document.getElementById("details").innerHTML = `
            <div class="user-info">
              <h2>Dziękujemy, ${data.name}! 🎉</h2>
              <p>Twoja subskrypcja została aktywowana.</p>
              <p>Email: <b>${data.email}</b></p>
            </div>
            <a href="/" class="btn">Powrót na stronę główną</a>
          `;
        })
        .catch(() => {
          document.querySelector(".loading").style.display = "none";
          document.getElementById("details").innerHTML = '<p class="error">❌ Błąd pobierania danych.</p>';
        });
    }
  </script>
</body>
</html>
